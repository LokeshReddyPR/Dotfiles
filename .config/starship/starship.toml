add_newline = true
command_timeout = 1000
palette = "gruvbox_dark"

# Line 1: directory + git (left) ... languages + duration (right)
# Line 2: prompt character
format = """$directory$git_branch$git_status$git_state$fill$nodejs$python$rust$golang$java$kotlin$lua$ruby$php$swift$dart$c$docker_context$package$cmd_duration\n$character"""

[fill]
symbol = ' '

# --- Left side (line 1) ---

[directory]
format = '[$path]($style) '
style = '#8ec07c'
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
symbol = ' '
style = 'yellow'

[git_status]
format = '[$all_status$ahead_behind]($style) '
style = 'red'
staged = '[+$count](green) '
modified = '[!$count](orange) '
untracked = '[?$count](aqua) '
deleted = '[✘$count](red) '
ahead = '[⇡$count](green)'
behind = '[⇣$count](red)'
diverged = '[⇡$ahead_count⇣$behind_count](yellow)'
conflicted = '[=$count](red) '

[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
style = 'yellow'

# --- Right side (line 1) ---

[cmd_duration]
format = '[  $duration]($style)'
style = 'gray'
min_time = 0

[nodejs]
format = '[ $version]($style) '
style = 'green'

[python]
format = '[ $version]($style) '
style = 'yellow'

[rust]
format = '[ $version]($style) '
style = 'orange'

[golang]
format = '[ $version]($style) '
style = 'blue'

[java]
format = '[ $version]($style) '
style = 'red'

[kotlin]
format = '[ $version]($style) '
style = 'purple'

[lua]
format = '[ $version]($style) '
style = 'blue'

[ruby]
format = '[ $version]($style) '
style = 'red'

[php]
format = '[ $version]($style) '
style = 'purple'

[swift]
format = '[ $version]($style) '
style = 'orange'

[dart]
format = '[ $version]($style) '
style = 'blue'

[c]
format = '[ $version]($style) '
style = 'blue'

[docker_context]
format = '[ $context]($style) '
style = 'blue'

[package]
format = '[ $version]($style) '
style = 'orange'

# --- Line 2 ---

[character]
success_symbol = '[❯](purple)'
error_symbol = '[❯](red)'

# --- Palette ---

[palettes.gruvbox_dark]
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
purple = "#d3869b"
aqua = "#8ec07c"
orange = "#fe8019"
fg = "#ebdbb2"
bg = "#282828"
gray = "#928374"
