
# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "screen-256color" # Set terminal type for 256-color support
set -ga terminal-overrides ",*256col*:Tc" # Override to enable true-color for compatible terminals

# General
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update the status bar every 3 seconds (default: 15 seconds)
set -g allow-passthrough on     # Allow programs in the pane to bypass tmux (e.g. for image preview)
set -g status-position bottom

# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Switch windows with Ctrl+Shift+H (previous) and Ctrl+Shift+L (next), no prefix
bind -n C-S-h previous-window
bind -n C-S-l next-window

# Kill pane without confirmation prompt
bind x kill-pane

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer


# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# tpm plugin manager
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # Enable navigating between nvim and tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # Automatically saves sessions every 15 minutes


# Style — Gruvbox dark palette
bg0="#282828"        # background
bg1="#3c3836"        # subtle background
bg2="#504945"        # inactive accents / borders
fg1="#ebdbb2"        # main foreground
fg4="#a89984"        # dimmed foreground
gray="#928374"       # neutral gray
red="#fb4934"
green="#b8bb26"
yellow="#fabd2f"
blue="#83a598"
aqua="#8ec07c"
orange="#fe8019"

set -g status-position top
set -g status-justify centre    # Center the window list in the status bar
set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=${fg1},bg=${bg0}"

# Left: tmux logo + session name
set -g status-left "#[fg=${green},bg=default,bold]  #[fg=${gray}]|#[fg=${green},bg=default,bold] #S #[fg=${green},bg=${bg0},nobold] "

# Center: window numbers/names (centered via status-justify above)
set -g window-status-current-format "#[fg=${yellow},bold]#[underscore]#I:#W#[nounderscore]#{?window_zoomed_flag, 󰍋 ,}"
set -g window-status-format "#[fg=${gray}]#I:#W"
set -g window-status-separator "  "

# Right: empty (single space — continuum treats "" as unset and re-injects the default)
set -g status-right " "


set -g message-style "fg=${fg1},bg=${bg1}"
set -g mode-style "fg=${bg0},bg=${blue}"
set -g pane-border-style "fg=${bg2}"
set -g pane-active-border-style "fg=${green}"

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
